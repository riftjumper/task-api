spring.config.import=optional:file:./.local/mysql.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_api_db?serverTimezone=Asia/Jakarta&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:task_api_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
